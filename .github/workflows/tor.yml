# Passwort-Tor [W45]: veröffentlicht NUR das verschlüsselte Spiel (dist/) auf GitHub Pages.
# Läuft erst, wenn in den Repo-Einstellungen
#   1. Secret   AMT_PASSWORT   = das Passwort       (Settings → Secrets and variables → Actions → Secrets)
#   2. Variable AMT_TOR        = ja                  (… → Variables)
#   3. Pages → Source = "GitHub Actions"
# gesetzt sind. Vorher ändert sich an der bisherigen Seite nichts.
name: Passwort-Tor veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.AMT_TOR == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/encrypt.mjs
        env:
          AMT_PASSWORT: ${{ secrets.AMT_PASSWORT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
